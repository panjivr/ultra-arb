# REYOG CAPITAL — Reverse proxy (HTTPS enabled via Let's Encrypt + sslip.io)
#
# Layout:
#   /              → frontend (Next.js :3000)
#   /api/*         → backend (FastAPI :8000)
#   /ws/*          → backend WebSocket
#   /docs, /openapi.json → backend (FastAPI auto-docs)

upstream reyog_backend {
    server backend:8000;
    keepalive 32;
}

upstream reyog_frontend {
    server frontend:3000;
    keepalive 32;
}

# Real IP (works behind Cloudflare/Load Balancer)
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Rate limit zones (per IP)
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=ws_zone:10m rate=10r/s;

# ─── HTTP :80 — ACME challenge + redirect everything to HTTPS ───
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Let's Encrypt challenge (renewals)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # G0.4: nginx-internal health stub (no upstream — proves nginx itself is alive)
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Everything else → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS :443 — main app ───
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # http2 on;  # disabled: HTTP/2 multiplexed conn breaks over the internet path
                  # for this host (browser shows "This page couldn't load" while
                  # sub-resources still 200). HTTP/1.1 is reliable here.
    # Accept BOTH sslip.io forms: dashes (cert CN) AND dots. sslip.io resolves
    # 103.31.38.106.sslip.io and 103-31-38-106.sslip.io to the same IP; the
    # Let's Encrypt cert now has both as SAN, so either URL works in a browser.
    server_name 103-31-38-106.sslip.io 103.31.38.106.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/103-31-38-106.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/103-31-38-106.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 10M;
    # gzip disabled: the Next.js upstream already sends gzip + chunked. Letting
    # nginx also handle compression here risked a double-encode / chunked-framing
    # conflict. Next.js compresses on its own, so responses stay compressed.
    gzip off;
    # gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    # gzip_min_length 1024;

    # WebSocket firehose
    location /ws/ {
        limit_req zone=ws_zone burst=20 nodelay;
        proxy_pass http://reyog_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # REST API
    location /api/ {
        limit_req zone=api_zone burst=60 nodelay;
        proxy_pass http://reyog_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # FastAPI auto-docs
    location ~ ^/(docs|openapi\.json|redoc) {
        proxy_pass http://reyog_backend;
        proxy_set_header Host $host;
    }

    # Health check passthrough
    location /health {
        proxy_pass http://reyog_backend;
        access_log off;
    }

    # Frontend (Next.js)
    location / {
        proxy_pass http://reyog_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
