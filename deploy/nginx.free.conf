# REYOG CAPITAL — Free-tier reverse proxy (HTTP-only, no cert required)
#
# Serves the whole app on plain :80 so you're online with just the VM's public
# IP (http://<IP>/). Works with a raw IP or any sslip.io/DuckDNS name pointing
# at it. To add HTTPS later, swap in deploy/nginx.conf + certbot — see
# docs/07-deploy-oracle-gratis.md.
#
#   /            -> frontend (Next.js :3000)
#   /api/*       -> backend  (FastAPI :8000)
#   /ws/*        -> backend  WebSocket
#   /docs, /openapi.json, /redoc -> backend auto-docs

upstream reyog_backend {
    server backend:8000;
    keepalive 32;
}

upstream reyog_frontend {
    server frontend:3000;
    keepalive 32;
}

real_ip_header X-Forwarded-For;
real_ip_recursive on;

limit_req_zone $binary_remote_addr zone=api_zone:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=ws_zone:10m rate=10r/s;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 10M;
    gzip off;

    # nginx-internal health stub
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # WebSocket firehose / live
    location /ws/ {
        limit_req zone=ws_zone burst=20 nodelay;
        proxy_pass http://reyog_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # REST API
    location /api/ {
        limit_req zone=api_zone burst=60 nodelay;
        proxy_pass http://reyog_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # FastAPI auto-docs
    location ~ ^/(docs|openapi\.json|redoc) {
        proxy_pass http://reyog_backend;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://reyog_backend;
        access_log off;
    }

    # Frontend (Next.js)
    location / {
        proxy_pass http://reyog_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
