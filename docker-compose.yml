# REYOG CAPITAL — Production stack
# Usage:
#   cp .env.example .env  # set domain etc.
#   docker compose up -d --build
#
# For local dev WITHOUT building, use docker-compose.dev.yml (only redis+postgres).
services:
  redis:
    image: redis:7-alpine
    container_name: reyog_redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:-reyog_redis_secret}
    volumes:
      - redis_data:/data
    networks: [reyog]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-reyog_redis_secret}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: reyog_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-arb}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-arb_secret}
      POSTGRES_DB: ${DB_NAME:-ultra_arb}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks: [reyog]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-arb} -d ${DB_NAME:-ultra_arb}"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: reyog_backend
    restart: unless-stopped
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-reyog_redis_secret}@redis:6379/0
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-arb}:${DB_PASSWORD:-arb_secret}@postgres:5432/${DB_NAME:-ultra_arb}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      PAPER_TRADE: "${PAPER_TRADE:-true}"
      FINANCIAL_DATASETS_API_KEY: ${FINANCIAL_DATASETS_API_KEY:-}
      BINANCE_API_KEY: ${BINANCE_API_KEY:-}
      BINANCE_API_SECRET: ${BINANCE_API_SECRET:-}
      BYBIT_API_KEY: ${BYBIT_API_KEY:-}
      BYBIT_API_SECRET: ${BYBIT_API_SECRET:-}
    networks: [reyog]

  engine:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: reyog_engine
    restart: unless-stopped
    depends_on:
      redis: { condition: service_healthy }
      backend: { condition: service_started }
    command: ["python", "-u", "scripts/real_market_engine.py"]
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-reyog_redis_secret}@redis:6379/0
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-arb}:${DB_PASSWORD:-arb_secret}@postgres:5432/${DB_NAME:-ultra_arb}
      PAPER_TRADE: "${PAPER_TRADE:-true}"
      # G2/Pilihan B: false disables crypto signals/trades; Polymarket unaffected.
      CRYPTO_STRATEGIES_ENABLED: "${CRYPTO_STRATEGIES_ENABLED:-true}"
    networks: [reyog]
    # Engine is a long-loop script — healthcheck via Redis ping (proves engine is publishing)
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import redis,sys,os,time; r=redis.from_url(os.environ.get('REDIS_URL','redis://redis:6379/0')); keys=r.keys('arb:ticks:*'); sys.exit(0 if len(keys)>0 else 1)\" || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  # F2 (G1.1-prod): RiskRunner-only service. NOT `arb.main` — running full
  # arb.main here would double-execute arb:signals (LiveExecutor vs the
  # engine's emit_trades) and duplicate feeds, re-polluting the honest
  # paper window. This runs only DrawdownBreaker/VolatilityBreaker +
  # the arb:risk:halted publisher. arb:orders stays single-writer
  # (emit_trades); reyog_risk only reads it.
  risk:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: reyog_risk
    restart: unless-stopped
    depends_on:
      redis: { condition: service_healthy }
      backend: { condition: service_started }
    command: ["python", "-m", "scripts.risk_main"]
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-reyog_redis_secret}@redis:6379/0
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-arb}:${DB_PASSWORD:-arb_secret}@postgres:5432/${DB_NAME:-ultra_arb}
      PAPER_TRADE: "${PAPER_TRADE:-true}"
      RISK_HEALTH_PORT: "8001"
    networks: [reyog]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8001/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  edge_runner:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: reyog_edges
    restart: unless-stopped
    depends_on:
      redis: { condition: service_healthy }
      backend: { condition: service_started }
    command: ["python", "-u", "scripts/edge_runner.py"]
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-reyog_redis_secret}@redis:6379/0
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-arb}:${DB_PASSWORD:-arb_secret}@postgres:5432/${DB_NAME:-ultra_arb}
    networks: [reyog]
    # Edge runner publishes to arb:edges:* — healthcheck verifies any edge stream exists
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import redis,sys,os; r=redis.from_url(os.environ.get('REDIS_URL','redis://redis:6379/0')); keys=r.keys('arb:edges:*'); sys.exit(0 if len(keys)>0 else 1)\" || exit 1"]
      interval: 60s
      timeout: 10s
      start_period: 180s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
    container_name: reyog_frontend
    restart: unless-stopped
    depends_on: [backend]
    networks: [reyog]

  nginx:
    image: nginx:alpine
    container_name: reyog_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certbot/conf:/etc/letsencrypt
      - ./deploy/certbot/www:/var/www/certbot
    depends_on:
      - backend
      - frontend
    networks: [reyog]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/nginx-health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  redis_data:
  pg_data:

networks:
  reyog:
    driver: bridge
